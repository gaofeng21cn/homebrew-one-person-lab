name: Tap Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test tap distribution boundaries
        run: |
          node test/downstream-boundary.test.mjs
          node test/stable-distribution.test.mjs
          node test/fleet-agent-cask.test.mjs
      - name: Guard tap surface
        run: |
          set -euo pipefail
          formula_files="$(find Formula -type f -name '*.rb' 2>/dev/null | sort || true)"
          if [ -n "$formula_files" ] && [ "$formula_files" != "Formula/opl.rb" ]; then
            echo "::error::This tap may publish only Formula/opl.rb and no Package-specific Formulae."
            exit 1
          fi
          formula_casks=(Casks/one-person-lab.rb)
          if [ -f Casks/one-person-lab-nightly.rb ]; then
            formula_casks+=(Casks/one-person-lab-nightly.rb)
          fi
          if [ -f Formula/opl.rb ]; then
            for cask in "${formula_casks[@]}"; do
              grep -q 'depends_on formula: "opl"' "$cask" || { echo "::error::$cask must depend on the published opl Formula."; exit 1; }
            done
          elif grep -q 'depends_on formula: "opl"' "${formula_casks[@]}"; then
            echo "::error::Standard and Nightly casks must not depend on opl before Formula/opl.rb is published."
            exit 1
          fi
          legacy_full_sha256="1bbc1afba6ca7f01c82b064dbf764d91f2f8ab6129bfec4ed65b160e171ca84e"
          if grep -q 'depends_on formula: "opl"' Casks/one-person-lab-full.rb; then
            actual_full_sha256="$(shasum -a 256 Casks/one-person-lab-full.rb | awk '{print $1}')"
            if [ "$actual_full_sha256" != "$legacy_full_sha256" ]; then
              echo "::error::Full casks consume the App-owned embedded Base and must not depend on Formula opl."
              exit 1
            fi
            echo "::warning::Accepting the exact legacy Full cask as read-only migration input; any replacement must remove the Formula dependency."
          fi
          if find Casks -type f ! -name 'one-person-lab.rb' ! -name 'one-person-lab-nightly.rb' ! -name 'one-person-lab-full.rb' ! -name 'opl-fleet-agent.rb' | grep .; then
            echo "::error::This tap may publish only the stable, nightly, and Full App casks plus OPL Fleet Agent."
            exit 1
          fi
          published_casks=(Casks/one-person-lab.rb Casks/one-person-lab-full.rb)
          if [ -f Casks/one-person-lab-nightly.rb ]; then
            published_casks+=(Casks/one-person-lab-nightly.rb)
          fi
          for cask in "${published_casks[@]}"; do
            grep -q '# homebrew_allowed_software_objects: opl_base,opl_app' "$cask" || { echo "::error::$cask must restrict Homebrew to Base and App."; exit 1; }
            grep -q '# opl_packages_lifecycle_command: opl packages' "$cask" || { echo "::error::$cask must route Package lifecycle through opl packages."; exit 1; }
            grep -q '# package_specific_formula_allowed: false' "$cask" || { echo "::error::$cask must forbid Package-specific Formulae."; exit 1; }
            grep -q '# package_specific_cask_allowed: false' "$cask" || { echo "::error::$cask must forbid Package-specific Casks."; exit 1; }
          done
          grep -q '# release_truth_authority: opl-fleet-agent_release' Casks/opl-fleet-agent.rb || { echo "::error::Fleet Agent release truth must remain in opl-fleet-agent."; exit 1; }
          grep -q '# retired_install_aliases_allowed: false' Casks/opl-fleet-agent.rb || { echo "::error::Fleet Agent must not restore retired install aliases."; exit 1; }
          if grep -q 'depends_on formula:' Casks/opl-fleet-agent.rb; then
            echo "::error::OPL Fleet Agent must remain independent of Formula opl."
            exit 1
          fi
          if grep -R "One-Person-Lab-Full" "${formula_casks[@]}"; then
            echo "::error::Only Casks/one-person-lab-full.rb may reference Full first-install assets."
            exit 1
          fi
      - name: Validate Ruby syntax
        run: |
          set -euo pipefail
          find Formula Casks -type f -name '*.rb' -print0 |
            xargs -0 -n1 ruby -c

  distribution-qualification:
    name: Homebrew online distribution qualification
    if: github.event_name == 'workflow_dispatch'
    needs: audit
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Formula and casks against public distribution
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_app_release_failure() {
            status=$?
            echo "::error::Homebrew tap audit failed in a downstream mirror. Route the audit output to the App release operator/authority for gaofeng21cn/one-person-lab-app; do not create tap-local release truth/currentness."
            exit "$status"
          }
          trap report_app_release_failure ERR
          brew tap "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
          if brew help trust >/dev/null 2>&1; then
            brew trust "$GITHUB_REPOSITORY"
          fi
          report_framework_release_failure() {
            status=$?
            echo "::error::Homebrew Formula audit failed in a downstream transport. Route the source head, Framework package manifest, or transport checksum output to the OPL Framework package release operator/authority; do not create tap-local release truth/currentness."
            exit "$status"
          }
          if [ -f Formula/opl.rb ]; then
            trap report_framework_release_failure ERR
            brew style "$GITHUB_REPOSITORY/opl"
            brew audit --strict --online "$GITHUB_REPOSITORY/opl"
          fi
          trap report_app_release_failure ERR
          published_cask_tokens=("$GITHUB_REPOSITORY/one-person-lab" "$GITHUB_REPOSITORY/one-person-lab-full")
          if [ -f Casks/one-person-lab-nightly.rb ]; then
            published_cask_tokens+=("$GITHUB_REPOSITORY/one-person-lab-nightly")
          fi
          brew style --cask "${published_cask_tokens[@]}"
          brew audit --cask --online "$GITHUB_REPOSITORY/one-person-lab"
          if [ -f Casks/one-person-lab-nightly.rb ]; then
            brew audit --cask "$GITHUB_REPOSITORY/one-person-lab-nightly"
          fi
          brew audit --cask --online "$GITHUB_REPOSITORY/one-person-lab-full"
          report_fleet_agent_release_failure() {
            status=$?
            echo "::error::Fleet Agent Cask audit failed in a downstream mirror. Route the asset, digest, signing, or packaging output to gaofeng21cn/opl-fleet-agent."
            exit "$status"
          }
          trap report_fleet_agent_release_failure ERR
          brew style --cask "$GITHUB_REPOSITORY/opl-fleet-agent"
          brew audit --cask --online "$GITHUB_REPOSITORY/opl-fleet-agent"
