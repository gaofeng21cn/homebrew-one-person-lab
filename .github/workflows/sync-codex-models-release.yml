name: Sync Codex Models Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional exact Codex Models release tag, for example v0.4.1
        required: false
        type: string
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: opl-homebrew-tap-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync Cask from Codex Models release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/sync-codex-models-cask.mjs --release-tag "$RELEASE_TAG"
          else
            node scripts/sync-codex-models-cask.mjs
          fi

      - name: Validate Codex Models projection
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node test/codex-models-cask.test.mjs
          node test/downstream-boundary.test.mjs
          brew tap "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
          tap_root="$(brew --repository "$GITHUB_REPOSITORY")"
          cp "$GITHUB_WORKSPACE/Casks/opl-codex-models.rb" "$tap_root/Casks/opl-codex-models.rb"
          if brew help trust >/dev/null 2>&1; then
            brew trust "$GITHUB_REPOSITORY"
          fi
          brew style --cask "$GITHUB_REPOSITORY/opl-codex-models"
          brew audit --cask --online "$GITHUB_REPOSITORY/opl-codex-models"

      - name: Commit Codex Models Cask
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Casks/opl-codex-models.rb; then
            echo "No Codex Models Cask update."
            exit 0
          fi
          git diff --quiet -- . ':(exclude)Casks/opl-codex-models.rb' || {
            echo "::error::Codex Models sync may modify only Casks/opl-codex-models.rb."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/opl-codex-models.rb
          git commit -m "Sync Codex Models Cask from release"
          git push origin HEAD:main
          echo "tap_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify remote main
        if: ${{ steps.commit.outputs.tap_commit != '' }}
        env:
          TAP_COMMIT: ${{ steps.commit.outputs.tap_commit }}
        run: test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$TAP_COMMIT"
