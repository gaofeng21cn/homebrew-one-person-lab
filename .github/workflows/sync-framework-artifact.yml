name: Sync Framework Formula
on:
  workflow_dispatch:
    inputs:
      artifact_digest:
        description: Published Framework OCI manifest digest (sha256)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: opl-homebrew-tap-write
  cancel-in-progress: false
jobs:
  sync:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate Formula from independent Framework artifact
        env:
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
        run: node scripts/sync-formula-from-framework-artifact.mjs --artifact-ref "ghcr.io/gaofeng21cn/one-person-lab-framework@$ARTIFACT_DIGEST"
      - name: Validate Formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          node test/downstream-boundary.test.mjs
          brew tap "$GITHUB_REPOSITORY" "$GITHUB_WORKSPACE"
          brew style "$GITHUB_REPOSITORY/opl"
          brew audit --strict --online "$GITHUB_REPOSITORY/opl"
      - name: Publish Formula
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/opl.rb; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/opl.rb
          git commit -m 'Sync independent Framework artifact'
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"
